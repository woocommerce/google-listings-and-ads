version: '3.1'

services:

  wordpress:
    image: wordpress:latest
    ports:
      - 8080:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      - wordpress_data:/var/www/html
      - ../examples/wordpress-plugin/:/var/www/html/wp-content/plugins/gtg-ads-example-plugin
      - ../:/var/www/html/wp-content/plugins/gtg-ads-example-plugin/vendor/google/gtg-ads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/wp-admin/install.php"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    healthcheck:
      test: ["CMD", "mysqladmin" , "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

  cli:
    image: wordpress:cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress_db
    command: tail -f /dev/null
    volumes:
      - wordpress_data:/var/www/html
      - ../examples/wordpress-plugin/:/var/www/html/wp-content/plugins/gtg-ads-example-plugin
      - ../:/var/www/html/wp-content/plugins/gtg-ads-example-plugin/vendor/google/gtg-ads
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy

volumes:
  db_data:
  wordpress_data:
