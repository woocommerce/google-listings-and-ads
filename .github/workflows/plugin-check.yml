name: 'WordPress Plugin Checks'

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PHP
        uses: woocommerce/grow/prepare-php@b9c1e59aae9fdbe668b068ebd59c1545a88ea9fa # actions-v3.0.5
        with:
          install-deps: "no"

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@b9c1e59aae9fdbe668b068ebd59c1545a88ea9fa # actions-v3.0.5
        with:
          node-version-file: ".nvmrc"
          ignore-scripts: "no"

      - name: Build production bundle
        run: npm run build

      - name: Prepare plugin build directory
        run: |
          mkdir build
          unzip -q google-listings-and-ads.zip -d build
          cp -a build/google-listings-and-ads/. build/
          rm -rf build/google-listings-and-ads

      - name: Run plugin check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./build

          exclude-checks: |
            plugin_readme
            plugin_updater
            file_type
            trademarks
            direct_db_queries
            performant_wp_query_params
            enqueued_scripts_in_footer
            plugin_header_text_domain

          exclude-directories: |
            .github
            node_modules
            vendor
            tests
            bin
            tools
            build
            assets
            lib

          # PHPStan-only; never shipped.
          exclude-files: |
            phpstan-bootstrap.php
