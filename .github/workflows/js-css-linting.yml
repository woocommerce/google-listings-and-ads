name: JavaScript and CSS Linting

on:
  push:
    branches:
      - trunk
      - develop
    paths:
      - "**.js"
      - "**.scss"
      - .github/workflows/js-css-linting.yml
  pull_request:
    paths:
      - "**.js"
      - "**.scss"
      - .github/workflows/js-css-linting.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 2

jobs:
  JSLintingCheck:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@3a4249a1fc7e39a987d213e578cbcf32abd55980 # actions-v3
        with:
          node-version-file: ".nvmrc"

      - name: Prepare annotation formatter
        uses: woocommerce/grow/eslint-annotation@3a4249a1fc7e39a987d213e578cbcf32abd55980 # actions-v3

      - name: Lint JavaScript and annotate linting errors
        run: npm run lint:js -- --quiet --format ./eslintFormatter.cjs

  CSSLintingCheck:
    name: Lint CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@3a4249a1fc7e39a987d213e578cbcf32abd55980 # actions-v3
        with:
          node-version-file: ".nvmrc"

      - name: Prepare annotation formatter
        uses: woocommerce/grow/stylelint-annotation@3a4249a1fc7e39a987d213e578cbcf32abd55980 # actions-v3

      - name: Lint CSS and annotate linting errors
        run: npm run lint:css -- --custom-formatter ./stylelintFormatter.cjs
