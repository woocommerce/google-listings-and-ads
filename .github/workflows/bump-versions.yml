name: 'Bump Versions'

# **What it does**: Checks out a release branch, bumps the version string in
#   google-listings-and-ads.php, package.json, and readme.txt, then commits and pushes.
# **Why we have it**: Called by release.yml as the first step after the release branch is created,
#   so the version bump commit is visible in the release PR diff.

on:
  workflow_call:
    inputs:
      version:
        description: 'New version string (e.g. 3.7.0)'
        required: true
        type: string
      release_branch:
        description: 'Release branch to update (e.g. release/3.7.0)'
        required: false
        type: string

jobs:
  bump:
    name: Bump version to ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BRANCH: ${{ inputs.release_branch != '' && inputs.release_branch || format('release/{0}', inputs.version) }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          token: ${{ secrets.ORG_DEPLOY_SECRET }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in google-listings-and-ads.php
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          version = os.environ["VERSION"]
          path = "google-listings-and-ads.php"
          content = open(path, "r", encoding="utf-8").read()

          # Bump plugin header Version line.
          content, count = re.subn(
              r"(^\s*\*\s[Vv]ersion:\s*).*$",
              rf"\g<1>{version}",
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if count == 0:
              raise SystemExit("Could not find plugin header Version line in google-listings-and-ads.php")

          # Bump version constants using WRCS markers.
          content, marker_count = re.subn(
              r"('[0-9]+\.[0-9]+\.[0-9]+-?([a-z]+)?\.?[0-9]*'\s*\);\s*//\s*WRCS:\s*DEFINED_VERSION\.)",
              lambda m: f"'{version}' ); // WRCS: DEFINED_VERSION.",
              content,
              count=1,
          )

          if marker_count == 0:
              raise SystemExit("Could not find WRCS marker-based version constant in google-listings-and-ads.php")

          open(path, "w", encoding="utf-8").write(content)
          PYEOF

      - name: Bump version in package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "

      - name: Bump version in package-lock.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            lock.version = process.env.VERSION;
            if (lock.packages && lock.packages['']) {
              lock.packages[''].version = process.env.VERSION;
            }
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, '\t') + '\n');
          "

      - name: Bump stable tag in readme.txt
        env:
          VERSION: ${{ inputs.version }}
        run: 'sed -i "s/^Stable tag: .*/Stable tag: ${VERSION}/" readme.txt'

      - name: Replace @since n.e.x.t placeholders
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          # Match only the tag itself, not any other incidental occurrence of "n.e.x.t".
          pattern = re.compile(r"@since\s+n\.e\.x\.t")
          extensions = {".php", ".js", ".jsx", ".ts", ".tsx"}
          exclude_prefixes = ("vendor/", "node_modules/", "js/build/", ".git/")

          changed_files = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              posix_path = path.as_posix()
              if posix_path.startswith(exclude_prefixes):
                  continue

              content = path.read_text(encoding="utf-8")
              new_content, count = pattern.subn(f"@since {version}", content)

              if count:
                  path.write_text(new_content, encoding="utf-8")
                  changed_files.append(posix_path)

          print(f"Replaced @since n.e.x.t in {len(changed_files)} file(s).")

          if changed_files:
              subprocess.run(["git", "add", *changed_files], check=True)
          PYEOF

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add google-listings-and-ads.php package.json package-lock.json readme.txt
          git commit -m "Release: Bump version to ${VERSION}."
          git push origin "${RELEASE_BRANCH}"
