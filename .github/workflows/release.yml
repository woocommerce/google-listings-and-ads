name: 'Prepare Release'
run-name: 'Prepare Release ${{ github.event.inputs.version }}${{ github.event.inputs.simulate == ''true'' && '' (simulate)'' || '''' }} by @${{ github.actor }}'

# **What it does**: Orchestrates the full release preparation pipeline:
#   1. Creates a release/x.x.x branch from develop.
#   2. Bumps version strings (bump-versions.yml).
#   3. Generates and commits the changelog (generate-changelog.yml).
#   4. Opens a PR to trunk.
#   - simulate=false: regular PR — merging triggers real deployment.
#   - simulate=true:  draft PR — simulate deploy check runs, nothing is deployed.
# **Why we have it**: To automate release preparation and gate deployment behind a PR review.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 3.7.0)'
        required: true
        type: string
      simulate:
        description: 'Simulate mode — opens a draft PR, runs simulate deploy check, no actual deployment'
        required: false
        default: false
        type: boolean

jobs:
  create-branch:
    name: Create release branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format. Use X.Y.Z (e.g., 3.7.0)"
            exit 1
          fi

      - name: Check release branch does not already exist
        env:
          GH_TOKEN: ${{ secrets.ORG_DEPLOY_SECRET }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/release%2F${{ inputs.version }}" --silent 2>/dev/null; then
            echo "::error::Branch release/${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.ORG_DEPLOY_SECRET }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push release branch
        run: |
          git checkout -b release/${{ inputs.version }}
          git push origin release/${{ inputs.version }}

  bump-versions:
    name: Bump versions
    needs: create-branch
    uses: ./.github/workflows/bump-versions.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  generate-changelog:
    name: Generate changelog
    needs: bump-versions
    uses: ./.github/workflows/generate-changelog.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  create-pr:
    name: Create Pull Request
    needs: generate-changelog
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          SIMULATE: ${{ inputs.simulate }}
          CHANGELOG_BLOCK: ${{ needs.generate-changelog.outputs.changelog_block }}
        with:
          github-token: ${{ secrets.ORG_DEPLOY_SECRET }}
          script: |
            const version = process.env.VERSION;
            const simulate = process.env.SIMULATE === 'true';
            const changelog = process.env.CHANGELOG_BLOCK.trim();

            const banner = simulate
              ? '> ⚠️ **Simulate mode** — This is a draft PR. Do not convert to a regular PR or merge it. Review the **Simulate Deploy** check output and then close this PR.'
              : '> ✅ **Production release** — Merging this PR will automatically trigger deployment to GitHub Releases and WordPress.org.';

            const body = [
              `## Release ${version}`,
              '',
              banner,
              '',
              '### Changelog',
              '```',
              changelog,
              '```',
              '',
              '### Release Checklist',
              '',
              '- [ ] All CI checks pass',
              '- [ ] Simulate deploy check output looks correct (version bump, changelog, zip contents, SVN diff)',
              simulate
                ? '- [ ] Close this draft PR after reviewing — do **not** merge'
                : '- [ ] Approve and merge to trigger deployment',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release: ${version}`,
              head: `release/${version}`,
              base: 'trunk',
              body,
              draft: simulate,
            });

            core.notice(`Pull Request created: ${pr.html_url}`);
