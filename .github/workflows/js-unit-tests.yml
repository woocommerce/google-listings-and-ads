name: JavaScript Unit Tests

on:
  push:
    branches:
      - trunk
      - develop
    paths:
      - "**.js"
      - package.json
      - package-lock.json
      - .github/workflows/js-unit-tests.yml
  pull_request:
    paths:
      - "**.js"
      - package.json
      - package-lock.json
      - .github/workflows/js-unit-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  UnitTests:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare node
        uses: woocommerce/grow/prepare-node@3a4249a1fc7e39a987d213e578cbcf32abd55980 # actions-v3
        with:
          node-version-file: ".nvmrc"

      - name: Run JavaScript unit tests
        run: npm run test:js

      - name: Upload JS unit coverage report
        uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/clover.xml
          flags: js-unit-tests
          name: js-coverage-report
